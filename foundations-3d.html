<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأساسات 3D</title>
<style>
  html,body{margin:0;height:100%;background:#f2eee6;font-family:"Segoe UI",Tahoma,sans-serif;color:#3a3a36}
  .sec{position:relative;height:100vh;overflow:hidden}
  .sec+.sec{border-top:2px solid #d8d2c4}
  #c3d,#f3d,#m3d,#a_c3d,#s_c3d{position:absolute;inset:0;cursor:grab;touch-action:none}
  #ui,#fui,#mui,#a_ui,#s_ui{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border:1px solid #d8d2c4;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;max-width:260px}
  #ui b,#fui b,#mui b,#a_ui b,#s_ui b{display:block;font-size:15px;margin-bottom:4px}
  #ui button,#fui button,#mui button,#a_ui button,#s_ui button{margin:3px 0 3px 6px;border:1px solid #b8b0a0;background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}
  #ui button.on,#fui button.on,#mui button.on,#a_ui button.on,#s_ui button.on{background:#3a3a36;color:#fff;border-color:#3a3a36}
  #ui button:hover:not(.on),#fui button:hover:not(.on),#mui button:hover:not(.on),#a_ui button:hover:not(.on),#s_ui button:hover:not(.on){background:#efe9dd}
  #fui,#mui{max-width:280px}
  #fui .k,#mui .k{font-size:12px;color:#6b6a64}
  /* control panels as a header toolbar across the top of each section */
  #ui,#fui,#mui,#a_ui,#s_ui{top:0;left:0;right:0;max-width:none;border-radius:0;border-width:0 0 1px;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px}
  #ui>div,#fui>div,#mui>div,#a_ui>div,#s_ui>div{display:flex;flex-wrap:wrap;align-items:center}
  #ui b,#fui b,#mui b,#a_ui b,#s_ui b{margin:0 0 0 6px}
  #fui .dot,#mui .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:5px;vertical-align:middle}
  #hint,#fhint,#mhint,#a_hint,#s_hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:13px;color:#7a7264}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<section class="sec" id="sFound">
<div id="f3d"></div>
<div id="fui"><b>مخطط الأساسات — v1 (الرسم اليدوي + مقاسات V3)</b>
<div><button id="fAuto">دوران تلقائي</button><button id="fTop">منظور علوي</button><button id="fDim" class="on">الأبعاد</button><button id="fGround">إظهار الأرض</button></div>
<div style="display:none"><button id="fGoH">↑ البيت</button><button id="fGoM">الأساسات + الكهف ↓</button></div>
<div class="k"><span class="dot" style="background:#9a9486"></span>قاعدة (سمل) · <span class="dot" style="background:#6f6a60"></span>عمود · <span class="dot" style="background:#c9c2b2"></span>جسر أرضي</div>
<div class="k"><span class="dot" style="background:#2f7fd9"></span>العمود الأزرق = قاعدة قوية تحمل وزناً كبيراً · قاعدة الطابق السفلي (−2.8 م)</div>
<div class="k">المقاسات مأخوذة من تصميم V3 · الخط المتقطع = الفناء المفتوح</div></div>
<div id="fhint">اسحب للتدوير · عجلة الفأرة أو إصبعان للتقريب</div>
<script>
(function(){
var el=document.getElementById('f3d');
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,400);
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
el.appendChild(renderer.domElement);
addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
scene.add(new THREE.AmbientLight(0xffffff,0.8));
var s1=new THREE.DirectionalLight(0xffffff,0.55);s1.position.set(14,26,10);scene.add(s1);
var s2=new THREE.DirectionalLight(0xffffff,0.25);s2.position.set(-12,14,-12);scene.add(s2);
function mat(c){return new THREE.MeshLambertMaterial({color:c});}
var M={pad:mat(0x9a9486),col:mat(0x6f6a60),beam:mat(0xc9c2b2),red:mat(0xd9412b),blue:mat(0x2f7fd9)};
function box(g,w,h,d,x,y,z,m){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o);return o;}
function label(g,t,x,y,z,sc,col){var cv=document.createElement('canvas');cv.width=512;cv.height=128;var c=cv.getContext('2d');
  var fs=64;c.font='600 '+fs+'px sans-serif';while(c.measureText(t).width>496&&fs>20){fs-=2;c.font='600 '+fs+'px sans-serif';}c.textAlign='center';c.fillStyle=col||'#a0306a';c.fillText(t,256,86);
  var tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));
  sp.scale.set(sc||2.4,(sc||2.4)*0.25,1);sp.position.set(x,y,z);g.add(sp);return sp;}

/* ---- grid = hand sketch topology, snapped to the V3 walls (house-3d-v3.html; V3 wins on sizes) ----
   x: L1 0 west wall | L2 3.6 west-strip wall (L2b merged into L2) | L3 6.7 corridor east / living west | L4 9.7 kitchen+grandma west | L5 12.7 east wall
   z: X1 -4 grandma back | X2 0 grandma/kitchen | A 2.5 yard line | B 5.5 living front (sketch 3) | C 9.5 main back (sketch 4) | D 11.5 (sketch 2) | E 14.9 street line */
var L1=0,L2=3.6,L3=6.7,L4=9.7,L5=12.7,GX=12.5,AP=5.0;   // foundation plan v5 (20/11/2026): L2 3.6; GX = grandmother east wall (2.80 wide); AP = extra column A' on row A
var A=2.5,B=5.5,C=9.5,D=11.5,E=14.9,X1=-4,X2=0;
var BW=0.25,BH=0.4;          // ground beam 25 x 40 cm
var CS=0.25;                 // column 25 x 25 cm
var PD=1.0,PT=0.35,DEPTH=1.2;// pad footing 1.0 x 1.0 x 0.35 at -1.2 m (assumed)

var gStruct=new THREE.Group(),gDim=new THREE.Group();scene.add(gStruct);scene.add(gDim);

var cols=[
  [L1,A],[L2,A],[AP,A],[L3,A,'blue'],[L4,A,'blue'],[L5,A,'blue'],
  [L1,B],[L2,B],[L3,B,'blue'],[L4,B,'blue'],[L5,B,'blue'],
  [L1,C],[L2,C],[L3,C,'blue'],[L4,C,'blue'],[L5,C,'blue'],
  [L1,D],[L2,D],[L3,D],[L4,D],[L5,D,'blue'],
  [L1,E],[L2,E],[L5,E],
  [L4,X1],[GX,X1],[L4,X2],[GX,X2]
];   // 28 columns; 10 deep (blue) = cave zone L3-L5 x A-C + L5/D
cols.forEach(function(p){
  var m=p[2]?M[p[2]]:M.col;
  var dp=p[2]==='blue'?2.8+PT:DEPTH;                                   // blue = base of the underground floor (floor at -2.8 m)
  box(gStruct,PD,PT,PD,p[0],-dp+PT/2,p[1],p[2]?m:M.pad);               // pad footing
  box(gStruct,CS,dp-PT+0.6,CS,p[0],(-dp+PT+0.6)/2,p[1],m);             // column starter (0.6 m above ground beam)
  if(p[2]==='blue'&&p[0]===L4&&p[1]===B)label(gDim,'قاعدة قوية · −3.15 م (10 قواعد)',p[0],-dp-0.4,p[1],3.2,'#2f7fd9');
  if(p[2]){var ring=new THREE.Mesh(new THREE.TorusGeometry(0.7,0.06,8,40),m);ring.rotation.x=Math.PI/2;ring.position.set(p[0],0.02,p[1]);gStruct.add(ring);}
});

function beamX(z,x1,x2){box(gStruct,x2-x1+BW,BH,BW,(x1+x2)/2,-BH/2,z,M.beam);}
function beamZ(x,z1,z2){box(gStruct,BW,BH,z2-z1+BW,x,-BH/2,(z1+z2)/2,M.beam);}
// rows
beamX(A,L1,L5);beamX(B,L1,L5);beamX(C,L1,L5);beamX(D,L2,L5);beamX(E,L1,L5);
beamX(X1,L4,GX);beamX(X2,L4,GX);                  // grandmother room, 2.80 wide
// column lines
beamZ(L1,A,E);beamZ(L2,A,E);beamZ(L3,A,C);beamZ(L4,X1,B);beamZ(L5,X2,E);beamZ(GX,X1,X2);
// recommended extra beams (translucent)
var Mrec=new THREE.MeshLambertMaterial({color:0xc9c2b2,transparent:true,opacity:0.4});
function recX(z,x1,x2){box(gStruct,x2-x1+BW,BH,BW,(x1+x2)/2,-BH/2,z,Mrec);}function recZ(x,z1,z2){box(gStruct,BW,BH,z2-z1+BW,x,-BH/2,(z1+z2)/2,Mrec);}
recX(D,L1,L2);recZ(L3,C,D);recZ(L4,B,D);recZ(10.3,C,E);

// dashed outline (not built) from the sketch — position estimated
var dash=new THREE.LineDashedMaterial({color:0x3a3a36,dashSize:0.3,gapSize:0.2});
var pts=[[L1,A],[L1,X2],[9.1,X2],[9.1,X1],[L4,X1]].map(function(p){return new THREE.Vector3(p[0],0.01,p[1]);});
var ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),dash);ln.computeLineDistances();gStruct.add(ln);

// ground (optional)
var ground=box(scene,16,0.02,20,L5/2,-0.01,(X1+E)/2,new THREE.MeshLambertMaterial({color:0xb9a888,transparent:true,opacity:0.55}));ground.visible=false;

// dimensions (from V3)
var y=0.9;
label(gDim,'3.6',(L1+L2)/2,y,E+0.9);
label(gDim,'3.1',(L2+L3)/2,y,A-0.6,1.6);
label(gDim,'3.0',(L3+L4)/2,y,A-0.6);
label(gDim,'3.0',(L4+L5)/2,y,X1-0.7);
label(gDim,'4',L5+1.0,y,(X1+X2)/2);
label(gDim,'2.5',L5+1.0,y,(X2+A)/2);
label(gDim,'3',L5+1.0,y,(A+B)/2);
label(gDim,'4',L5+1.0,y,(B+C)/2);
label(gDim,'2',L5+1.0,y,(C+D)/2);
label(gDim,'3.4',L5+1.0,y,(D+E)/2);
label(gDim,'12.7',(L1+L5)/2,y,E+1.8,2.4,'#3a3a36');
label(gDim,'18.9',L5+2.4,y,(X1+E)/2,2.4,'#3a3a36');

// camera
var cx=L5/2,cz=(X1+E)/2,theta=0.9,phi=0.9,r=28,auto=true;
function place(){camera.position.set(cx+r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi),cz+r*Math.sin(phi)*Math.cos(theta));camera.lookAt(cx,-0.3,cz);}
var drag=false,px=0,py=0,pd=0;
el.addEventListener('pointerdown',function(e){drag=true;auto=false;px=e.clientX;py=e.clientY;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';});
el.addEventListener('pointermove',function(e){if(!drag)return;theta-=(e.clientX-px)*0.008;phi-=(e.clientY-py)*0.006;phi=Math.max(0.15,Math.min(1.55,phi));px=e.clientX;py=e.clientY;});
el.addEventListener('pointerup',function(){drag=false;el.style.cursor='grab';});
el.addEventListener('wheel',function(e){e.preventDefault();r+=e.deltaY*0.02;r=Math.max(8,Math.min(50,r));},{passive:false});
el.addEventListener('touchstart',function(e){if(e.touches.length===2)pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);});
el.addEventListener('touchmove',function(e){if(e.touches.length===2){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);r-=(d-pd)*0.05;r=Math.max(8,Math.min(50,r));pd=d;}},{passive:true});
document.getElementById('fGoM').onclick=function(){document.getElementById('sMerge').scrollIntoView({behavior:'smooth'});};
document.getElementById('fGoH').onclick=function(){document.getElementById('sHouse').scrollIntoView({behavior:'smooth'});};
document.getElementById('fAuto').onclick=function(){auto=!auto;};
document.getElementById('fTop').onclick=function(){auto=false;phi=0.15;theta=0;};
document.getElementById('fDim').onclick=function(){gDim.visible=!gDim.visible;this.classList.toggle('on',gDim.visible);};
document.getElementById('fGround').onclick=function(){ground.visible=!ground.visible;this.classList.toggle('on',ground.visible);this.textContent=ground.visible?'إخفاء الأرض':'إظهار الأرض';};
(function anim(){requestAnimationFrame(anim);if(auto)theta+=0.0035;place();renderer.render(scene,camera);})();
})();
</script>
</section>
</body>
</html>
